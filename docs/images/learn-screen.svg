<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" font-family="Roboto, Arial, sans-serif">
<rect x="6" y="6" width="348" height="728" rx="36" fill="#222" stroke="#555" stroke-width="3"/>
<rect x="18" y="20" width="324" height="700" rx="24" fill="#121212"/>
<text x="38" y="72" text-anchor="start" font-size="22" fill="#fff">Learn: ON/OFF</text><text x="38" y="100" text-anchor="start" font-size="12" fill="#bbb">Hold the phone top edge 1–2 m from the hood,</text><text x="38" y="118" text-anchor="start" font-size="12" fill="#bbb">facing it. Press Test (or Auto-scan) and watch</text><text x="38" y="136" text-anchor="start" font-size="12" fill="#bbb">the hood. When it reacts (beep / light / fan),</text><text x="38" y="154" text-anchor="start" font-size="12" fill="#bbb">press "It worked".</text><text x="38" y="190" text-anchor="start" font-size="11" fill="#888">Protocol</text><rect x="35" y="196" width="290" height="30" rx="4" fill="#2d2d2d"/><text x="45" y="216" text-anchor="start" font-size="13" fill="#eee">ALL</text><text x="38" y="248" text-anchor="start" font-size="11" fill="#888">Scan type</text><rect x="35" y="254" width="290" height="30" rx="4" fill="#2d2d2d"/><text x="45" y="274" text-anchor="start" font-size="13" fill="#eee">Quick scan (common addresses)</text><text x="38" y="306" text-anchor="start" font-size="11" fill="#888">Auto-scan delay: 700 ms per code</text><rect x="38" y="316" width="284" height="4" rx="2" fill="#555"/><circle cx="150" cy="318" r="8" fill="#80cbc4"/><text x="38" y="350" text-anchor="start" font-size="16" fill="#fff">Code 42 / 3240</text><text x="38" y="370" text-anchor="start" font-size="13" fill="#bbb">NEC  addr 0x0  cmd 0x29</text><rect x="35" y="390" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="415.0" text-anchor="middle" font-size="14" fill="#eee">▶ Test next code</text><rect x="35" y="438" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="463.0" text-anchor="middle" font-size="14" fill="#eee">◀ Prev code</text><rect x="35" y="486" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="511.0" text-anchor="middle" font-size="14" fill="#eee">↻ Send this code again</text><rect x="35" y="534" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="559.0" text-anchor="middle" font-size="14" fill="#eee">▶▶ Auto-scan</text><rect x="35" y="582" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="607.0" text-anchor="middle" font-size="14" fill="#eee">✔ It worked — save as ON/OFF</text><rect x="35" y="630" width="290" height="40" rx="6" fill="#2d2d2d"/><text x="180" y="655.0" text-anchor="middle" font-size="14" fill="#eee">← Back</text></svg>